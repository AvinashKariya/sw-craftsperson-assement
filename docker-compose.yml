version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: acme_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acme_salary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acme_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/acme_salary
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: acme_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
